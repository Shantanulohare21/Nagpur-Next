kind = "web"
previewPath = "/shouldersim-old/"
title = "ShoulderSim AI (old)"
version = "1.0.0"
id = "artifacts/shouldersim"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/shouldersim-old/" ]
localPort = 21120

[services.development]
run = "pnpm --filter @workspace/shouldersim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shouldersim", "run", "build" ]
publicDir = "artifacts/shouldersim/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21120"
BASE_PATH = "/shouldersim-old/"
