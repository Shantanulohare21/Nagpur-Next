kind = "web"
previewPath = "/"
title = "ShoulderSIM AI"
version = "1.0.0"
id = "artifacts/shouldersim-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23413

[services.development]
run = "pnpm --filter @workspace/shouldersim-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shouldersim-ai", "run", "build" ]
publicDir = "artifacts/shouldersim-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23413"
BASE_PATH = "/"
